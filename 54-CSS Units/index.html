<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Units</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>CSS Units</h1>
        <div class="unit-demo">
            <div class="box px">PX: 100px</div>
            <div class="box rem">REM: 6rem</div>
            <div class="box em">EM: 6em</div>
            <div class="box percent">PERCENT: 80%</div>
            <div class="box vh">VH: 30vh</div>
            <div class="box vw">VW: 30vw</div>
        </div>
    </div>
</body>
</html>
