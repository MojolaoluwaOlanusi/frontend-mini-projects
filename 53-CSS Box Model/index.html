<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Model</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>CSS Box Model</h1>
        <div class="box-model">
            <div class="content">Content</div>
        </div>
        <div class="explanation">
            <p>This box demonstrates the CSS Box Model:</p>
            <ul>
                <li><strong>Content:</strong> The actual content area</li>
                <li><strong>Padding:</strong> Space between content and border</li>
                <li><strong>Border:</strong> Border around the padding</li>
                <li><strong>Margin:</strong> Space outside the border</li>
            </ul>
        </div>
    </div>
</body>
</html>
